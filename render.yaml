services:
  - type: web
    name: hnx26-fraud-intelligence
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && python3 -m venv .venv && .venv/bin/python -m pip install -r requirements.txt && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_PATH
        value: .venv/bin/python
